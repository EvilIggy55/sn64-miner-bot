[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sn64-miner-bot"
version = "0.1.0"
description = "Standalone GPU model-serving controller for k3s, modelled on the Chutes (SN64) miner stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "kubernetes>=30.1",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# SN64 metagraph stats. Optional because bittensor has no wheels for some platforms;
# the bot runs without it and reports the chain panel as unavailable.
chain = ["bittensor>=11.1,<12"]

[project.scripts]
miner-bot = "cli:main"
# Single-box serving (no k3s): see src/miner_bot/local_serve.py.
miner-bot-serve = "miner_bot.local_serve:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["miner_bot"]
py-modules = ["cli"]
