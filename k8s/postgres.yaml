# Postgres for the bot's event log. The password comes from the miner-bot-secrets Secret
# (deploy_stack.sh); it's only applied when the data volume is first initialised.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sn64
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sn64
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        miner-bot/role: control
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: miner_bot
            - name: POSTGRES_DB
              value: miner_bot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miner-bot-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "miner_bot", "-d", "miner_bot"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path  # k3s's built-in provisioner
        resources:
          requests:
            storage: 5Gi
